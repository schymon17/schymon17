<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="How I work: Process, Architecture, Backend, Interface, Automation, Production">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .box { fill: #f8fafc; stroke: #cbd5e1; }
    .t { fill: #0f172a; }
    .n { fill: #0f766e; }
    .rail { stroke: #cbd5e1; }
    .flow { stroke: #0d9488; }
    .last { fill: #0f766e; stroke: #0f766e; }
    .lt { fill: #ffffff; }
    .ln { fill: #99f6e4; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0f172a; stroke: #334155; }
      .t { fill: #f1f5f9; }
      .n { fill: #2dd4bf; }
      .rail { stroke: #334155; }
      .flow { stroke: #2dd4bf; }
      .last { fill: #0d9488; stroke: #2dd4bf; }
    }
    .flow { stroke-dasharray: 10 14; animation: run 1.2s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <line class="rail" x1="120" y1="75" x2="1160" y2="75" stroke-width="2"/>
  <line class="flow" x1="120" y1="75" x2="1160" y2="75" stroke-width="2" stroke-linecap="round"/>

  <g class="sans" font-size="18" font-weight="700" text-anchor="middle">
    <g transform="translate(30 35)">
      <rect class="box" width="180" height="80" rx="16" stroke-width="1.5"/>
      <text class="mono n" x="90" y="30" font-size="12" font-weight="400" letter-spacing="1.5">01</text>
      <text class="t" x="90" y="56">Process</text>
    </g>
    <g transform="translate(238 35)">
      <rect class="box" width="180" height="80" rx="16" stroke-width="1.5"/>
      <text class="mono n" x="90" y="30" font-size="12" font-weight="400" letter-spacing="1.5">02</text>
      <text class="t" x="90" y="56">Architecture</text>
    </g>
    <g transform="translate(446 35)">
      <rect class="box" width="180" height="80" rx="16" stroke-width="1.5"/>
      <text class="mono n" x="90" y="30" font-size="12" font-weight="400" letter-spacing="1.5">03</text>
      <text class="t" x="90" y="56">Backend</text>
    </g>
    <g transform="translate(654 35)">
      <rect class="box" width="180" height="80" rx="16" stroke-width="1.5"/>
      <text class="mono n" x="90" y="30" font-size="12" font-weight="400" letter-spacing="1.5">04</text>
      <text class="t" x="90" y="56">Interface</text>
    </g>
    <g transform="translate(862 35)">
      <rect class="box" width="180" height="80" rx="16" stroke-width="1.5"/>
      <text class="mono n" x="90" y="30" font-size="12" font-weight="400" letter-spacing="1.5">05</text>
      <text class="t" x="90" y="56">Automation</text>
    </g>
    <g transform="translate(1070 35)">
      <rect class="last" width="180" height="80" rx="16" stroke-width="1.5"/>
      <text class="mono ln" x="90" y="30" font-size="12" font-weight="400" letter-spacing="1.5">06</text>
      <text class="lt" x="90" y="56">Production</text>
    </g>
  </g>
</svg>
